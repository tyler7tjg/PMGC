<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">TB</span>
          <div>
            <p class="eyebrow">Workspace</p>
            <h1>Taskboard</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="view-tabs" role="group" aria-label="View">
            <button class="nav-button active" id="dashboardButton" type="button">Dashboard</button>
            <button class="nav-button" id="boardViewButton" type="button">Board</button>
          </div>
          <div class="search-wrap" id="searchWrap">
            <span aria-hidden="true">/</span>
            <input id="searchInput" type="search" placeholder="Search cards" autocomplete="off" />
          </div>
          <button class="secondary-button topbar-button" id="labelsButton" type="button">Labels</button>
          <button class="icon-button" id="resetBoardButton" type="button" title="Reset board" aria-label="Reset board">
            R
          </button>
          <button class="primary-button" id="newCardButton" type="button">
            <span aria-hidden="true">+</span>
            Card
          </button>
        </div>
      </header>

      <main class="board-page">
        <section class="dashboard-view" id="dashboardView" aria-label="Boards dashboard">
          <div class="dashboard-header">
            <div>
              <p class="eyebrow">Workspace</p>
              <h2>Dashboard</h2>
            </div>

            <button class="primary-button" id="dashboardNewBoardButton" type="button">
              <span aria-hidden="true">+</span>
              Board
            </button>
          </div>

          <section class="workspace-stats" aria-label="Workspace summary">
            <article>
              <span id="workspaceBoards">0</span>
              <p>Boards</p>
            </article>
            <article>
              <span id="workspaceCards">0</span>
              <p>Total cards</p>
            </article>
            <article>
              <span id="workspaceDueSoon">0</span>
              <p>Due soon</p>
            </article>
            <article>
              <span id="workspaceDone">0</span>
              <p>Completed</p>
            </article>
          </section>

          <section class="dashboard-grid" id="dashboardGrid" aria-label="Boards"></section>
        </section>

        <section class="board-workspace hidden" id="boardView" aria-label="Selected board">
          <section class="board-toolbar" aria-label="Board controls">
            <div class="board-title-block">
              <p class="eyebrow" id="boardMeta">Board</p>
              <h2 id="boardTitle">Website Relaunch</h2>
            </div>

            <div class="board-controls">
              <label class="board-select-wrap">
                Board
                <select id="boardSelect" aria-label="Choose board"></select>
              </label>

              <div class="board-actions" aria-label="Board actions">
                <button class="secondary-button" id="newBoardButton" type="button">
                  <span aria-hidden="true">+</span>
                  Board
                </button>
                <button class="icon-button light" id="renameBoardButton" type="button" title="Rename board" aria-label="Rename board">
                  E
                </button>
                <button class="icon-button danger-icon" id="deleteBoardButton" type="button" title="Delete board" aria-label="Delete board">
                  X
                </button>
              </div>

              <div class="toolbar-group" role="group" aria-label="Filter cards by priority">
                <button class="segmented active" data-filter="all" type="button">All</button>
                <button class="segmented" data-filter="High" type="button">High</button>
                <button class="segmented" data-filter="Medium" type="button">Medium</button>
                <button class="segmented" data-filter="Low" type="button">Low</button>
              </div>
            </div>
          </section>

          <section class="stats-grid" aria-label="Board summary">
            <article>
              <span id="totalCards">0</span>
              <p>Total cards</p>
            </article>
            <article>
              <span id="dueSoonCards">0</span>
              <p>Due soon</p>
            </article>
            <article>
              <span id="completedCards">0</span>
              <p>Completed</p>
            </article>
          </section>

          <section class="board" id="board" aria-label="Task board"></section>
        </section>
      </main>
    </div>

    <dialog class="card-dialog" id="cardDialog">
      <form id="cardForm" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow" id="dialogMode">New Card</p>
            <h2>Card details</h2>
          </div>
          <button class="icon-button ghost" id="closeDialogButton" type="button" title="Close" aria-label="Close dialog">
            x
          </button>
        </div>

        <input id="cardId" type="hidden" />
        <label>
          Title
          <input id="cardTitle" name="title" type="text" maxlength="80" required />
        </label>

        <label>
          Notes
          <textarea id="cardDescription" name="description" rows="4" maxlength="260"></textarea>
        </label>

        <div class="form-grid">
          <label>
            Column
            <select id="cardColumn" name="column"></select>
          </label>

          <label>
            Priority
            <select id="cardPriority" name="priority">
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </label>
        </div>

        <div class="form-grid">
          <label>
            Owner
            <input id="cardOwner" name="owner" type="text" maxlength="32" />
          </label>

          <label>
            Due
            <input id="cardDueDate" name="dueDate" type="date" />
          </label>
        </div>

        <fieldset id="labelsFieldset">
          <legend>Labels</legend>
          <div class="labels-picker" id="cardLabels"></div>
        </fieldset>

        <section class="comments-panel hidden" id="commentsPanel" aria-label="Task comments">
          <div class="section-header">
            <div>
              <p class="eyebrow">Discussion</p>
              <h3>Comments</h3>
            </div>
          </div>

          <div class="comments-list" id="commentsList"></div>

          <div class="comment-form">
            <label>
              User
              <input id="commentUser" type="text" maxlength="32" placeholder="Name" />
            </label>
            <label>
              Comment
              <textarea id="commentText" rows="2" maxlength="240" placeholder="Add a comment"></textarea>
            </label>
            <button class="secondary-button" id="addCommentButton" type="button">Add comment</button>
          </div>
        </section>

        <div class="dialog-actions">
          <button class="danger-button hidden" id="deleteCardButton" type="button">Delete</button>
          <button class="secondary-button" id="cancelButton" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="card-dialog labels-dialog" id="labelsDialog">
      <form id="labelsForm" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Workspace</p>
            <h2>Labels</h2>
          </div>
          <button class="icon-button ghost" id="closeLabelsDialogButton" type="button" title="Close" aria-label="Close dialog">
            x
          </button>
        </div>

        <section class="label-editor" id="labelsList" aria-label="Edit labels"></section>

        <section class="label-create" aria-label="Create label">
          <label>
            Name
            <input id="newLabelName" type="text" maxlength="28" placeholder="New label" />
          </label>
          <label>
            Color
            <select id="newLabelColor">
              <option value="teal">Teal</option>
              <option value="yellow">Yellow</option>
              <option value="blue">Blue</option>
              <option value="green">Green</option>
              <option value="red">Red</option>
              <option value="slate">Slate</option>
            </select>
          </label>
          <button class="secondary-button" id="addLabelButton" type="button">Add label</button>
        </section>

        <div class="dialog-actions">
          <button class="secondary-button" id="cancelLabelsButton" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="card-dialog" id="boardDialog">
      <form id="boardForm" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow" id="boardDialogMode">New Board</p>
            <h2>Board details</h2>
          </div>
          <button class="icon-button ghost" id="closeBoardDialogButton" type="button" title="Close" aria-label="Close dialog">
            x
          </button>
        </div>

        <input id="boardId" type="hidden" />
        <label>
          Name
          <input id="boardName" name="boardName" type="text" maxlength="60" required />
        </label>

        <label id="boardTemplateWrap">
          Starting cards
          <select id="boardTemplate" name="boardTemplate">
            <option value="blank">Blank board</option>
            <option value="launch">Website launch</option>
            <option value="ops">Operations workflow</option>
            <option value="hiring">Hiring pipeline</option>
          </select>
        </label>

        <div class="dialog-actions">
          <button class="secondary-button" id="cancelBoardButton" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
